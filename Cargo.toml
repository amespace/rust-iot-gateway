[package]
name = "rust-iot-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"]}
rumqttd = "0.20.0"
serde = {version = "1.0.229", features= ["derive"]}
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"]}
tokio-util = {version = "0.7.19", features = ["codec"]}
toml = "1.1.6"
uuid = {version = "1.26.1", features= ["v4", "serde"]}
