[package]
name = "rust-iot-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
# rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored", "sasl"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
rumqttd = "0.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde", "v7"] }
